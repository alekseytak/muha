version: os-glagolov/1.0
project: mirror-swarm
comment: >
  Политика эмпатического роя. Гормоны и эмоции влияют только на контекст
  (risk_appetite), но никогда не расширяют набор разрешённых глаголов.

emotion_effects:
  радость:
    risk_appetite_delta: +0.10
    learning_rate_scale: 1.2      # дофамин усиливает пластичность
  злость:
    risk_appetite_delta: -0.20
    learning_rate_scale: 0.9
  страх:
    risk_appetite_delta: -0.40
    learning_rate_scale: 0.5      # сужение сознания: только выживание

empathy_bus:
  max_broadcast_intensity: 0.5    # против паники роя
  decay_per_hop: 0.7
  roles_allowed_to_broadcast: [Observer, Analyst, Decider, Guardian]

kozyrev_mirror:
  required_before_levels: [L4, L5]
  paradox_threshold: 0.66         # как в KEM 4.2: > 0.66 -> Quantum Escape
  on_paradox:
    verb: эскалирует
    role: Guardian

ulam_chaos:
  injection_phase: exploration_only
  amplitude_max: 0.02
  min_episodes_between_injections: 5

collective_meditation:
  frequency_hz: 86.84             # октава Ω5, резонанс серотонина
  min_sync_order: 0.8
  required_before: swarm_joint_task
